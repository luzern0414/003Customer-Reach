# LLM 路由（草案）—— 所有模型走 OpenAI 兼容接口
providers:
  deepseek:  { base_url: https://api.deepseek.com/v1, key_env: DEEPSEEK_API_KEY }
  qwen:      { base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, key_env: DASHSCOPE_API_KEY }
  kimi:      { base_url: https://api.moonshot.cn/v1, key_env: MOONSHOT_API_KEY }
  glm:       { base_url: https://open.bigmodel.cn/api/paas/v4, key_env: ZHIPU_API_KEY }
  anthropic: { key_env: ANTHROPIC_API_KEY }   # 可选

# 具体 model id 在开发时按各家最新文档确认
routes:
  supervisor: { provider: deepseek, model: "<strong-model>", fallback: [qwen, kimi] }
  reporter:   { provider: deepseek, model: "<strong-model>", fallback: [qwen] }
  extractor:  { provider: qwen,     model: "<cheap-model>",  fallback: [deepseek] }
  embedding:  { provider: qwen,     model: "<embedding-model>", dim: 1024 }

limits:
  max_tool_steps_per_subgraph: 6
  request_timeout_s: 60
