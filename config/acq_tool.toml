# acq 信息查询工具配置（src/tools/acq_query）。路径可用相对项目根目录的路径。

[browser]
# Agent 专用 Edge（与个人浏览器隔离，保存各站点登录态）
edge_exe = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
profile_dir = "data/browser-profile/edge-agent"
# OpenCLI Browser Bridge 扩展（解压目录，含 manifest.json）
extension_dir = "C:/Users/Chilth/.opencli/browser-extension"
start_url = "https://qiye.qianlima.com/new_qd_yfbsite/#/infoCenter/search"
connect_timeout = 60

[opencli]
# 项目内置的定制版 OpenCLI（见 vendor/opencli/NOTICE.md）；为空时依次尝试内置目录与全局安装
package_dir = "vendor/opencli"
command_timeout = 300
plugin_dir = "src/opencli-plugin"

[query]
days = 365
limit = 60
sources = ["yfbzb", "qianlima", "chinabidding", "jianyu", "ebnew", "ccgp", "ggzy", "cborg", "exa"]
yfbzb_types = ["zhaobiao", "zhongbiao", "caigou"]
# 两次站点调用之间的间隔（秒）
pause = 2.0

[exa]
mcp_url = "https://mcp.exa.ai/mcp"
num_results = 10

[output]
processed_dir = "data/processed/companies"
raw_dir = "data/raw"
